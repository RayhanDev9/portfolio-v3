<!-- =============================================================================
     CERTIFICATES SECTION COMPONENT
     Showcase sertifikat terverifikasi (Udemy & Codepolitan) dengan filter kategori
     dan interactive lightbox preview modal.
     ============================================================================= -->
<section id="certificates" class="py-12 md:py-16 overflow-hidden relative">
  <div class="max-w-6xl px-6 mx-auto">
    <!-- Header & Filter Tabs -->
    <div class="mb-8 md:mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div class="text-center md:text-left">
        <span
          class="inline-flex px-4 py-2 rounded-full border border-white/10 bg-white/5 text-purple-300 text-sm text-loop mb-4"
        >
          Credentials &amp; Certifications
        </span>
        <h2 class="text-3xl md:text-4xl font-bold tracking-tight text-white mb-3">
          Verified Learning Certificates
        </h2>
        <p class="text-gray-400 text-base max-w-xl mx-auto md:mx-0">
          Comprehensive courses and professional skill credentials completed across leading tech education platforms.
        </p>
      </div>

      <!-- Filter Buttons -->
      <div id="certificateFilters" class="flex flex-wrap justify-center md:justify-end gap-2">
        <button
          type="button"
          data-filter="all"
          class="cert-filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-purple-600 text-white border border-purple-500 shadow-lg shadow-purple-500/20 transition-all cursor-pointer"
        >
          All (9)
        </button>
        <button
          type="button"
          data-filter="udemy"
          class="cert-filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-white/5 text-gray-300 border border-white/10 hover:border-purple-500/40 hover:text-white transition-all cursor-pointer flex items-center gap-1.5"
        >
          <span class="w-2 h-2 rounded-full bg-purple-400"></span>
          <span>Udemy (3)</span>
        </button>
        <button
          type="button"
          data-filter="codepolitan"
          class="cert-filter-btn px-4 py-1.5 rounded-full text-xs font-medium bg-white/5 text-gray-300 border border-white/10 hover:border-emerald-500/40 hover:text-white transition-all cursor-pointer flex items-center gap-1.5"
        >
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span>Codepolitan (6)</span>
        </button>
      </div>
    </div>

    <!-- Certificates Grid (Rendered dynamically by js/modules/certificates.js) -->
    <div
      id="certificatesGrid"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    ></div>

    <!-- Certificates Load More & Counter Container -->
    <div id="certsPagination" class="mt-12 flex flex-col items-center justify-center gap-3">
      <button
        type="button"
        id="certsLoadMoreBtn"
        class="inline-flex items-center gap-2.5 px-6 py-3 rounded-full bg-white/5 hover:bg-purple-600 active:scale-95 border border-white/10 hover:border-purple-500 text-sm font-semibold text-white shadow-lg shadow-purple-500/10 hover:shadow-purple-500/25 transition-all duration-300 cursor-pointer group"
      >
        <span id="certsLoadMoreText">Lihat Sertifikat Lainnya</span>
        <svg id="certsLoadMoreIcon" class="w-4 h-4 text-purple-400 group-hover:text-white transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <p id="certsCountIndicator" class="text-xs text-gray-400 font-medium">
        Menampilkan <span class="text-purple-300 font-semibold" id="certsVisibleCount">0</span> dari <span class="text-white font-semibold" id="certsTotalCount">0</span> sertifikat
      </p>
    </div>
  </div>

  <!-- Interactive Lightbox Preview Modal -->
  <div
    id="certificateModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 backdrop-blur-md p-4 transition-all duration-300 opacity-0"
    role="dialog"
    aria-modal="true"
    aria-labelledby="certModalTitle"
  >
    <div
      id="certModalContent"
      class="relative max-w-4xl w-full bg-gray-900 border border-white/15 rounded-2xl overflow-hidden shadow-2xl scale-95 transition-transform duration-300"
    >
      <!-- Modal Header Bar -->
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-white/10 bg-white/5">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <span
            id="certModalBadge"
            class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold uppercase tracking-wider shrink-0"
          >
            Platform
          </span>
          <h3 id="certModalTitle" class="text-sm md:text-base font-bold text-white truncate">
            Certificate Title
          </h3>
        </div>
        <button
          type="button"
          id="certModalClose"
          class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-white/10 transition-colors cursor-pointer shrink-0 ml-2"
          aria-label="Close modal"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Image Container -->
      <div class="p-2 md:p-4 bg-gray-950/70 flex items-center justify-center max-h-[75vh] overflow-hidden">
        <img
          id="certModalImg"
          src=""
          alt="Certificate Preview"
          class="w-full h-auto max-h-[70vh] object-contain rounded-lg shadow-lg border border-white/5"
        />
      </div>

      <!-- Modal Footer -->
      <div class="px-5 py-3 border-t border-white/10 bg-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <p id="certModalIssuer" class="text-xs text-gray-400">
          Issuer: <span class="text-gray-200 font-medium">Instructor / Platform</span>
        </p>
        <span class="text-[11px] text-gray-400 italic">Press ESC or click outside to close</span>
      </div>
    </div>
  </div>
</section>
